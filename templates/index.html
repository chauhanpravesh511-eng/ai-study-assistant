<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PA.AI - Dynamic AI Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<style>
  html, body {
    position: fixed !important;
    overflow: hidden !important;
    width: 100%;
    height: 100dvh;
    overscroll-behavior: none;
    touch-action: none;
}
#chat-container {
    touch-action: pan-y !important;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{background:#0A0F1E;color:white;height:100dvh;display:flex;flex-direction:column}
.header{padding:15px;text-align:center;border-bottom:1px solid #1E293B;background:#0A0F1E;position:sticky;top:0;z-index:100}
.header h2{background:linear-gradient(90deg,#3B82F6,#60A5FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px}
#chat-container::-webkit-scrollbar{width:6px;}
#chat-container::-webkit-scrollbar-thumb{background:#3B82F6; border-radius:10px;}
 #chat-container{flex:1; min-height:0; overflow-y:auto; padding:20px; max-width:800px; width:100%; margin:auto; overscroll-behavior:contain;}
.msg{padding:12px 16px;margin:10px 0;max-width:85%;line-height:1.6;animation:fade .3s;border-radius:18px;word-wrap:break-word;overflow-wrap:break-word}
.msg.user{background:#2563EB;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:#1E293B;margin-right:auto;border-bottom-left-radius:4px}
/* YE HAI ASLI FIX - CODE KA BOX */
.msg.ai pre{background:#000;padding:12px;border-radius:10px;overflow-x:auto;margin:10px 0;white-space:pre-wrap}
.msg.ai code{background:#0F172A;padding:2px 6px;border-radius:5px;color:#7CFC00}
.msg.ai pre code{background:transparent;padding:0}
.msg.ai h1,.msg.ai h2,.msg.ai h3{margin:10px 0 5px}
.msg.ai p{margin:6px 0}
.msg.ai ul{padding-left:20px;margin:6px 0}
.input-area{display:flex;gap:10px;padding:15px;padding-bottom:calc(25px + env(safe-area-inset-bottom));background:#0A0F1E;border-top:1px solid #1E293B;max-width:800px;width:100%;margin:auto}
input{flex:1;padding:12px 18px;border-radius:25px;border:1px solid #334155;background:#1E293B;color:white;outline:none;font-size:16px}
button{padding:12px 20px;border-radius:25px;border:none;background:#2563EB;color:white;cursor:pointer;font-weight:bold}
.typing{color:#94A3B8;font-style:italic;font-size:14px;padding-left:20px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="header"><h2>PA.AI - Dynamic AI Assistant</h2><p style="font-size:12px;color:#94A3B8;margin-top:5px;">Bilkul Meta AI ki tarah - Kuch bhi pucho</p></div>
<div id="chat-container">
<div class="msg ai">Hi User! 👋 Main tumhara Dynamic AI Assistant hu.</div>
</div>
<div id="typing" class="typing" style="display:none;max-width:800px;margin:auto;width:100%;">AI is typing...</div>
<div class="input-area">
<input id="userInput" type="text" placeholder="Message your AI Assistant..." onkeypress="if(event.keyCode==13) sendMessage()"
<button type="button" id="micBtn" onclick="startVoice()" style="padding:12px 14px; background:#1E293B; font-size:19px;">🎤</button>
<button onclick="sendMessage()">Send</button>
</div>
<p id="voiceStatus" style="text-align:center; font-size:13px; color:#94A3B8;"></p>

<script>
  function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Voice Chrome me chalega");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'hi-IN';
  recognition.interimResults = false;

  document.getElementById("voiceStatus").innerText = "🎤 Sun raha hu... bolo...";
  document.getElementById("micBtn").innerText = "🔴";
  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("userInput").value = text;
    document.getElementById("voiceStatus").innerText = "✅ Tumne bola: " + text;
    document.getElementById("micBtn").innerText = "🎤";
  };

  recognition.onerror = function() {
    document.getElementById("voiceStatus").innerText = "Dobara try karo";
    document.getElementById("micBtn").innerText = "🎤";
  };
}
async function sendMessage(){
  let input = document.getElementById('userInput');
  let msg = input.value.trim();
  if(!msg) return;
  let chat = document.getElementById('chat-container');

  // Check kar - user neeche hai ya upar purana padh raha hai?
  let isNearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100;

  let userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.textContent = msg;
  chat.appendChild(userDiv); // innerHTML ki jagah ye - refresh nahi hoga
  input.value = '';
  if(isNearBottom) chat.scrollTop = chat.scrollHeight;

  document.getElementById('typing').style.display = 'block';

  let res = await fetch('/get_response', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: msg})
  });
  let data = await res.json();
  document.getElementById('typing').style.display = 'none';

  let cleanHtml = DOMPurify.sanitize(marked.parse(data.reply));
  let aiDiv = document.createElement('div');
  aiDiv.className = 'msg ai';
  aiDiv.innerHTML = cleanHtml;
  chat.appendChild(aiDiv);

  // Sirf tab neeche jayega jab tu pehle se neeche tha
  if(isNearBottom) chat.scrollTop = chat.scrollHeight;
}
// Pull-to-Refresh ko poora band karne ke liye
let lastY = 0;
document.addEventListener('touchstart', function(e) {
    lastY = e.touches[0].clientY;
}, {passive: true});

document.addEventListener('touchmove', function(e) {
    let chat = document.getElementById('chat-container');
    let currentY = e.touches[0].clientY;
    // Agar chat sabse upar hai aur tu neeche kheench raha hai, to rok de
    if (chat && chat.scrollTop <= 0 && currentY > lastY) {
        e.preventDefault();
    }
}, {passive: false});
</script>
</body>
</html>
